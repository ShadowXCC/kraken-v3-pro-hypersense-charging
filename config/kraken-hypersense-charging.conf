# Razer Kraken V3 Pro: HyperSense while charging.
# Plain key = value lines. Restart the service after editing:
#   sudo systemctl restart kraken-hypersense-charging

# Also clear the Chroma gate (command 0x93), so the earcup LEDs come back while charging.
# The haptics gate (0x94) is always cleared; this one is the optional extra.
chroma = yes

# How often charge_status is read, in seconds. This is a cached value inside the driver, so
# polling it costs nothing on the USB bus; 0.5 s is quick enough to catch the brief dip to 0
# that a headset power-cycle produces while the cable is still plugged in.
poll_seconds = 0.5

# How long to wait after the charger appears before sending. The headset asserts the gate when
# it sees the charger, so sending too early simply gets overwritten.
settle_seconds = 2.0

# Never send twice inside this window.
min_send_interval = 5.0

# Re-send every N seconds while charging. 0 disables it, which is the default: every known way
# the gate comes back also moves charge_status, so the event triggers are enough. Set this (120
# is a sensible value) only if you find haptics dropping out with no event to explain it.
keepalive_seconds = 0
